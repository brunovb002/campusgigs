services:
  db:
    image: postgres:16-alpine
    container_name: campusgigs-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: campusgigs
      POSTGRES_USER: campusgigs
      POSTGRES_PASSWORD: campusgigs
    ports:
      - "5432:5432"
    volumes:
      - campusgigs-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campusgigs"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: campusgigs-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: campusgigs
      DB_USER: campusgigs
      DB_PASSWORD: campusgigs
      # Permite sobrescrever de fora (ex.: CEP_BASE_URL=http://host-inexistente:9999
      # docker compose up) para simular o serviço externo de CEP fora do ar.
      CEP_BASE_URL: ${CEP_BASE_URL:-https://viacep.com.br/ws}
    ports:
      - "8080:8080"

volumes:
  campusgigs-db-data:
