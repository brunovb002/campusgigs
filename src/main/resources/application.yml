spring:
  application:
    name: campusgigs

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:campusgigs}
    username: ${DB_USER:campusgigs}
    password: ${DB_PASSWORD:campusgigs}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Nunca 'update' ou 'create' — o schema é controlado inteiramente pelo Flyway
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

# Será usado a partir do CP3 (emissão/validação de JWT)
app:
  jwt:
    secret: ${JWT_SECRET:troque-este-segredo-antes-de-ir-pra-producao}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
