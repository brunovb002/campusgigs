spring:
  application:
    name: campusgigs

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:campusgigs}
    username: ${DB_USER:campusgigs}
    password: ${DB_PASSWORD:campusgigs}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Nunca 'update' ou 'create' — o schema é controlado inteiramente pelo Flyway
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:troque-este-segredo-antes-de-ir-pra-producao}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}

  # Cliente HttpExchange do CP5 — base-url/timeout configuráveis para dar pra
  # simular o serviço externo fora do ar/lento em teste manual (ver README).
  cep:
    base-url: ${CEP_BASE_URL:https://viacep.com.br/ws}
    timeout-ms: ${CEP_TIMEOUT_MS:3000}
